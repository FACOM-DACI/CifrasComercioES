<!DOCTYPE html>
<html lang="es">
<head>
    <title>Cifras de comercio de El Salvador</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            color: white;
            min-height: 100vh;
        }

        h1 {
            margin-bottom: 40px;
            font-size: 2.5rem;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        h1 img {
            width: 40px;
            height: auto;
        }

        .dashboard-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 1000px;
            margin-bottom: 60px;
            min-height: 300px;
            flex: 1;
        }

        .card {
            background: white;
            color: #333;
            border-radius: 20px;
            padding: 50px 60px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            text-align: center;
            max-width: 550px;
            width: 100%;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .card h2 {
            margin-top: 0;
            font-size: 2rem;
            color: #1e3c72;
        }

        .card p {
            font-size: 1.1rem;
            color: #555;
            margin: 20px 0;
            line-height: 1.6;
        }

        .btn {
            display: inline-block;
            margin-top: 25px;
            padding: 14px 45px;
            border-radius: 30px;
            background: #2a5298;
            color: white;
            text-decoration: none;
            border: none;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.2s ease;
        }

        .btn:hover {
            background: #1e3c72;
            transform: scale(1.05);
        }

        footer {
            margin-top: 20px;
            font-size: 0.9rem;
            opacity: 0.8;
            text-align: center;
        }

        .footer-visits {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        /* Responsive para móviles */
        @media (max-width: 700px) {
            h1 {
                font-size: 1.8rem;
                flex-direction: column;
                text-align: center;
                gap: 10px;
            }

            h1 img {
                width: 35px;
            }

            .card {
                padding: 35px 30px;
            }

            .card h2 {
                font-size: 1.6rem;
            }

            .card p {
                font-size: 1rem;
            }

            .btn {
                padding: 12px 35px;
                font-size: 1rem;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.5rem;
            }

            .card {
                padding: 25px 20px;
            }

            .card h2 {
                font-size: 1.3rem;
            }

            .btn {
                padding: 10px 28px;
                font-size: 0.9rem;
            }

            .dashboard-container {
                min-height: 200px;
            }
        }
    </style>
</head>

<body>

    <h1>
        <img src="https://flagpedia.net/data/flags/w580/sv.webp" alt="Bandera de El Salvador" />
        Cifras de comercio de El Salvador
    </h1>

    <div class="dashboard-container">
        <div class="card" onclick="location.href='dashboard1.html'">
            <h2>📊 Cifras BCR</h2>
            <p>Cifras de comercio exterior provenientes de la base de datos del BCR</p>
            <button class="btn">Ver datos →</button>
        </div>
    </div>

    <footer>
        <div class="footer-visits">
            <span>👥</span>
            <img src="https://visitor-badge.laobi.icu/badge?page_id=CifrasComercioES-badge&left_text=Visitas"
                 alt="contador de visitas"
                 style="vertical-align: middle;">
        </div>
        <div>© 2026 - Jorge Campos & Gabriel Rivas</div>
    </footer>

</body>
</html>
